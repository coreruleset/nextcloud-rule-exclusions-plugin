# OWASP CRS Plugin Descriptor
# https://github.com/coreruleset/plugin-registry

schema_version: 1

plugin:
  name: "nextcloud-rule-exclusions-plugin"
  description: "CRS rule exclusions for Nextcloud"
  long_description: |
    Provides targeted rule exclusions to eliminate false positives when
    running OWASP CRS in front of Nextcloud, a productivity platform and
    file hosting service. Covers the core Nextcloud apps (Files, Photos,
    Calendar, Contacts, Mail, Office, Talk, and others), including their
    high performance backends. Also includes optional, disabled-by-default
    workarounds for the Nextcloud iOS app's file upload content type
    issue and for the Nextcloud Server Crawler used for document
    previews and high performance backend setup checks.
  type: "official"
  category: "rule-exclusion"
  status: "tested"
  license: "Apache-2.0"
  authors:
    - name: "OWASP CRS Team"
      url: "https://coreruleset.org"
  repository: "https://github.com/coreruleset/nextcloud-rule-exclusions-plugin"
  keywords:
    - "nextcloud"
    - "file-hosting"
    - "collaboration"
    - "rule-exclusion"
    - "false-positive"

rule_id_range:
  start: 9508000
  end: 9508999

compatibility:
  crs_version: ">=4.0.0"

configuration:
  file: "plugins/nextcloud-rule-exclusions-config.conf"
  variables:
    - name: "tx.nextcloud-rule-exclusions-plugin_enabled"
      type: "boolean"
      default: 1
      description: "Enable or disable the Nextcloud rule exclusions plugin (0 to disable)"
    - name: "tx.nextcloud-rule-exclusions-plugin_ios_workaround_enabled"
      type: "boolean"
      default: 0
      description: "Enable the workaround for the Nextcloud iOS app's file upload content type issue (disabled by default due to bypass risk)"
    - name: "tx.nextcloud-rule-exclusions-plugin_server_crawler_rules_enabled"
      type: "boolean"
      default: 0
      description: "Enable rule exclusions for the Nextcloud Server Crawler (disabled by default; Should only be enabled via a SecRule scoped to server's IP address)"
