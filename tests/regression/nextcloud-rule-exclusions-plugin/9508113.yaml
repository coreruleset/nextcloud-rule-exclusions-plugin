---
meta:
  author: "azurit"
  description: "Nextcloud Rule Exclusions Plugin"
rule_id: 9508113
tests:
  - test_id: 1
    desc: "Downloading a file with [] in it's name"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS test agent
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/remote.php/dav/files/user@example.com/public/directory/filename[96].pdf"
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [932130]
