---
meta:
  author: "Esad Cetiner"
  description: "Nextcloud Rule Exclusions Plugin"
rule_id: 9508514
tests:
  - test_id: 1
    desc: Make sure server crawler rule exclusions are disabled out of the box
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: /
          version: HTTP/1.1
        output:
          log:
            expect_ids: [920320]
  - test_id: 2
    desc: |
      Make sure server crawler rule exclusions are disabled out of the box
      Deleting a message from talk
      URL path could be anything.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            content-type: application/json
            x-nextcloud-talk-random: 2S01/qx0JNnwMrV0/R2jWIJxub8KJ70Dnb39wMx9QiR459P2UU4HxY7iG2YaYOSF
            user-agent: Nextcloud-Server-Crawler/35.0.3
            x-nextcloud-talk-signature: 02860e64e0032a66845596f4a1796c20ed894692c23f4c9b8fd24543336b652d
            x-nextcloud-talk-backend: https://cloud.example.com/
            accept-encoding: br, gzip
            ocs-apirequest: true
            host: cloud.example.com
          port: 80
          method: POST
          uri: /
